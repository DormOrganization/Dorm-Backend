name: "CodeQL Deep SAST Analysis"

on:
  push:
    branches: [ "main", "master", "dev" ]
  pull_request:
    branches: [ "main", "master" ]
  schedule:
    - cron: '0 2 * * *' # فحص يومي الساعة 2:00 صباحاً

jobs:
  analyze:
    name: CodeQL Security Analysis
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [ 'csharp' ] # تحديد لغة الـ Backend (C# / .NET)

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    # تهيئة أداة CodeQL
    - name: Initialize CodeQL
      uses: github/codeql-action/init@v3
      with:
        languages: ${{ matrix.language }}
        queries: security-extended,security-and-quality # فحص أمني موسع وعالي الدقة

    # بناء مشروع الـ .NET تلقائياً
    - name: Autobuild
      uses: github/codeql-action/autobuild@v3

    # تشغيل التحليل المتقدم وإنشاء التقرير
    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v3
      with:
        category: "/language:${{matrix.language}}"
